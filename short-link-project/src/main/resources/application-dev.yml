spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/short_link?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: qweasd                    # 本地开发值，部署时改环境变量
    hikari:
      maximum-pool-size: 20             # 2 核机器别开太大
      minimum-idle: 5
      connection-timeout: 3000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 本地 Redis 未设 requirepass，故不配 password；若加了密码在此补上
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated   # 生产者确认
    publisher-returns: true             # 路由失败回调
    listener:
      simple:
        acknowledge-mode: manual         # 手动 ACK
        prefetch: 100
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: false                 # 重试交给死信队列，不用本地重试

mybatis-plus:
  configuration:
    # 开发期打印 SQL：用于验证布隆过滤器 / 缓存是否真的拦住了 DB 查询
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
